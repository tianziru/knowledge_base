<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>灵犀智库 · 智能问答</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sidebar: #0f172a;
      --sidebar-2: #1e293b;
      --sidebar-hover: #334155;
      --accent: #0ea5e9;
      --accent-soft: rgba(14, 165, 233, 0.16);
      --bg: #e8eef4;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --user-bg: #0ea5e9;
      --bot-bg: #f8fafc;
      --ok: #16a34a;
      --err: #dc2626;
      --shadow: 0 1px 0 rgba(15, 23, 42, 0.04), 0 12px 40px rgba(15, 23, 42, 0.08);
      --radius: 14px;
      --font: "DM Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(900px 480px at 12% -10%, rgba(14, 165, 233, 0.14), transparent 55%),
        radial-gradient(700px 420px at 100% 0%, rgba(15, 23, 42, 0.06), transparent 50%),
        var(--bg);
    }
    .shell {
      display: flex;
      height: 100vh;
      margin: 0;
      padding: 12px;
      gap: 12px;
    }

    /* —— Sidebar —— */
    .sidebar {
      width: 268px;
      flex-shrink: 0;
      background: linear-gradient(180deg, var(--sidebar) 0%, #111827 100%);
      color: #e2e8f0;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .brand {
      padding: 22px 18px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
      position: relative;
    }
    .brand-logo::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px solid rgba(255,255,255,0.85);
      border-radius: 50%;
      border-top-color: transparent;
      transform: rotate(-25deg);
    }
    .brand-name { font-size: 18px; font-weight: 700; letter-spacing: 0.02em; color: #fff; }
    .brand-sub { margin-top: 3px; font-size: 12px; color: #94a3b8; }
    .side-actions { padding: 14px 12px 8px; }
    .btn-new {
      width: 100%;
      border: 1px dashed rgba(125, 211, 252, 0.45);
      background: var(--accent-soft);
      color: #7dd3fc;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, border-color .15s;
    }
    .btn-new:hover { background: rgba(14, 165, 233, 0.28); border-color: #7dd3fc; }
    .session-label {
      padding: 10px 16px 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
    }
    .session-list {
      flex: 1;
      overflow: auto;
      padding: 0 10px 12px;
    }
    .session-item {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: #cbd5e1;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 4px;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .session-item:hover { background: var(--sidebar-hover); color: #fff; }
    .session-item.active {
      background: var(--accent-soft);
      color: #7dd3fc;
    }
    .session-item .t {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .session-item .d { font-size: 11px; color: #64748b; }
    .session-item.active .d { color: rgba(125, 211, 252, 0.7); }
    .session-item .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .session-item .del {
      width: 18px; height: 18px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; line-height: 1; color: #94a3b8;
      opacity: 0; transition: opacity .15s, background .15s, color .15s;
      cursor: pointer; flex-shrink: 0;
    }
    .session-item:hover .del { opacity: 1; }
    .session-item .del:hover { background: rgba(239,68,68,0.18); color: #ef4444; }
    .sidebar-foot {
      padding: 12px 14px 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
      color: #94a3b8;
    }
    .sidebar-foot a {
      color: #7dd3fc;
      text-decoration: none;
    }
    .sidebar-foot a:hover { text-decoration: underline; }
    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-right: 6px;
      background: #64748b;
      vertical-align: middle;
    }
    .status-dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(22,163,74,0.25); }

    /* —— Main —— */
    .main {
      flex: 1;
      min-width: 0;
      background: var(--panel);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #fff, #f8fafc);
    }
    .topbar h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
    }
    .topbar p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .toggle {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      cursor: pointer;
    }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #f8fafc; }
    .btn.primary {
      border: none;
      background: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { filter: brightness(1.05); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn.danger { color: var(--err); border-color: #fecaca; }

    .chat {
      flex: 1;
      overflow: auto;
      padding: 20px 22px 12px;
      background:
        linear-gradient(180deg, rgba(14,165,233,0.04), transparent 28%),
        #fff;
    }

    .empty {
      max-width: 560px;
      margin: 8vh auto 0;
      text-align: center;
    }
    .empty h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .empty p {
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 420px;
    }
    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left;
    }
    @media (max-width: 720px) {
      .shell { padding: 0; gap: 0; }
      .sidebar { display: none; }
      .main { border-radius: 0; border: none; }
      .suggestions { grid-template-columns: 1fr; }
    }
    .sug {
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      line-height: 1.45;
      font-family: inherit;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .sug:hover {
      border-color: #7dd3fc;
      background: #f0f9ff;
      transform: translateY(-1px);
    }
    .sug small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .msg {
      display: flex;
      gap: 10px;
      margin: 14px 0;
      align-items: flex-start;
      animation: fadeUp .28s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .msg { animation: none; }
    }
    .msg.user { flex-direction: row-reverse; }
    .msg > .body { max-width: min(720px, 86%); min-width: 0; }
    .avatar {
      width: 34px; height: 34px;
      border-radius: 10px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: #334155;
    }
    .avatar.user { background: var(--accent); }
    .avatar.bot {
      background: linear-gradient(135deg, #38bdf8, #0369a1);
    }
    .bubble {
      border-radius: 14px;
      padding: 12px 14px;
      line-height: 1.65;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
      background: var(--bot-bg);
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border-color: transparent;
      color: #fff;
    }
    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      padding: 0 4px;
    }
    .meta { font-size: 11px; color: var(--muted); }
    .msg.user .meta-row { justify-content: flex-end; }
    .icon-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      font-family: inherit;
    }
    .icon-btn:hover { background: #f1f5f9; color: var(--text); }

    .answer-text { white-space: pre-wrap; }
    .answer-images {
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }
    .answer-images img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      object-fit: contain;
    }
    .answer-images a {
      display: none;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .dots { display: inline-flex; gap: 4px; }
    .dots i {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #94a3b8;
      display: block;
      animation: blink 1.2s infinite ease-in-out;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    .composer-wrap {
      border-top: 1px solid var(--border);
      padding: 12px 16px 14px;
      background: #fff;
    }
    .composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 10px 10px 14px;
      background: #f8fafc;
      transition: border-color .15s, box-shadow .15s;
    }
    .composer:focus-within {
      border-color: #7dd3fc;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
      background: #fff;
    }
    .composer textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      font-size: 14px;
      line-height: 1.5;
      background: transparent;
      font-family: inherit;
      color: var(--text);
    }
    .composer-actions { display: flex; gap: 6px; align-items: center; }
    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 5px;
      background: #fff;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <div class="brand-logo" aria-hidden="true"></div>
          <div>
            <div class="brand-name">灵犀智库</div>
            <div class="brand-sub">设备说明书智能问答</div>
          </div>
        </div>
      </div>
      <div class="side-actions">
        <button type="button" class="btn-new" id="btnNew">＋ 新建对话</button>
      </div>
      <div class="session-label">最近会话</div>
      <div class="session-list" id="sessionList"></div>
      <div class="sidebar-foot">
        <div style="margin-bottom:8px;">
          <span class="status-dot" id="apiDot"></span>
          <span id="apiLabel">API 检测中…</span>
        </div>
        <a id="linkImport" href="http://127.0.0.1:8000/" target="_blank" rel="noopener">打开导入后台 →</a>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div>
          <h1 id="chatTitle">智能客服</h1>
          <p>优先依据已入库说明书作答；不足时再联网补充</p>
        </div>
        <div class="top-actions">
          <label class="toggle"><input type="checkbox" id="streamToggle" checked /> 流式输出</label>
          <button type="button" class="btn" id="btnStop" disabled>停止</button>
          <button type="button" class="btn danger" id="btnClear">清空本会话</button>
        </div>
      </header>

      <div class="chat" id="chat"></div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="2" placeholder="描述设备型号与问题，例如：WIN 耳机如何配对？"></textarea>
          <div class="composer-actions">
            <button type="button" class="btn primary" id="send">发送</button>
          </div>
        </div>
        <div class="hint">
          <span><span class="kbd">Enter</span> 发送 · <span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</span>
          <span>回答过程不展示内部检索阶段</span>
        </div>
      </div>
    </section>
  </div>

  <script>
    const API_BASE = (location.protocol.startsWith('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001');
    const STORE_KEY = 'kb_chat_sessions_v1';
    const IMPORT_URL = (location.hostname === '127.0.0.1' || location.hostname === 'localhost')
      ? `http://${location.hostname}:8000/`
      : 'http://127.0.0.1:8000/';

    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnStop = document.getElementById('btnStop');
    const btnClear = document.getElementById('btnClear');
    const btnNew = document.getElementById('btnNew');
    const streamToggle = document.getElementById('streamToggle');
    const sessionListEl = document.getElementById('sessionList');
    const chatTitle = document.getElementById('chatTitle');
    const apiDot = document.getElementById('apiDot');
    const apiLabel = document.getElementById('apiLabel');
    document.getElementById('linkImport').href = IMPORT_URL;

    const SUGGESTIONS = [
      { q: '这款设备如何开机和配对？', tip: '快速上手' },
      { q: '出现报错或无法连接怎么排查？', tip: '故障排查' },
      { q: '日常保养和维护要注意什么？', tip: '保养维护' },
      { q: '关键按键或指示灯分别是什么意思？', tip: '界面识图' },
    ];

    let store = loadStore();
    let sessionId = store.currentId;
    let activeEs = null;
    let busy = false;

    function loadStore() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          if (data && Array.isArray(data.sessions) && data.sessions.length) {
            if (!data.currentId || !data.sessions.some(s => s.id === data.currentId)) {
              data.currentId = data.sessions[0].id;
            }
            return data;
          }
        }
      } catch (_) {}
      const id = makeSessionId();
      return { currentId: id, sessions: [{ id, title: '新对话', updatedAt: Date.now() }] };
    }

    function saveStore() {
      localStorage.setItem(STORE_KEY, JSON.stringify(store));
    }

    function makeSessionId() {
      return 'sess-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    }

    function currentSession() {
      return store.sessions.find(s => s.id === sessionId);
    }

    function syncChrome() {
      const s = currentSession();
      chatTitle.textContent = (s && s.title) ? s.title : '智能客服';
      renderSessionList();
    }

    function renderSessionList() {
      const sorted = [...store.sessions].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      sessionListEl.innerHTML = '';
      for (const s of sorted) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'session-item' + (s.id === sessionId ? ' active' : '');
        btn.innerHTML = `<div class="row"><span class="t">${escapeHtml(s.title || '新对话')}</span><span class="del" title="删除会话">&times;</span></div><span class="d">${formatDay(s.updatedAt)}</span>`;
        btn.addEventListener('click', () => switchSession(s.id));
        btn.querySelector('.del').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteSession(s.id);
        });
        sessionListEl.appendChild(btn);
      }
    }

    async function deleteSession(id) {
      if (!confirm('确定删除该会话吗？')) return;
      try {
        await fetch(`${API_BASE}/history/${id}`, { method: 'DELETE' });
      } catch (_) {}
      store.sessions = store.sessions.filter(s => s.id !== id);
      saveStore();
      if (sessionId === id) {
        if (store.sessions.length) {
          await switchSession(store.sessions[0].id);
        } else {
          newSession();
        }
      } else {
        syncChrome();
      }
    }

    function formatDay(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
    }

    function touchSession(titleMaybe) {
      const s = currentSession();
      if (!s) return;
      s.updatedAt = Date.now();
      if (titleMaybe && (s.title === '新对话' || !s.title)) {
        s.title = String(titleMaybe).trim().slice(0, 28) || '新对话';
      }
      saveStore();
      syncChrome();
    }

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function nowTime() {
      return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function formatTime(ts) {
      if (!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if (Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function isImageUrl(url) {
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (_) {
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl) {
      return String(rawUrl || '').trim().replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr) {
      const seen = new Set();
      const out = [];
      for (const x of (Array.isArray(arr) ? arr : [])) {
        const v = String(x || '');
        if (!v || seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text) {
      const matches = String(text || '').match(/(https?:\/\/[^\s]+)/g) || [];
      const trimTail = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHead = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
      return dedupeKeepOrder(matches.map(m => trimHead(trimTail(m))).filter(Boolean));
    }

    function findLastImageMarkerIndex(raw) {
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m, lastIdx = -1, lastLen = 0;
      while ((m = re.exec(String(raw || ''))) !== null) {
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text) {
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if (idx === -1) return { text: raw, images: [] };
      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];
      for (const line of after.split(/\r?\n/).map(l => l.trim()).filter(Boolean)) {
        if (line.startsWith('http://') || line.startsWith('https://')) urls.push(line);
        else urls.push(...extractUrlsLoose(line));
      }
      const seen = new Set();
      const images = [];
      for (const u of urls) {
        const n = normalizeUrl(u);
        if (!isImageUrl(n) || seen.has(n)) continue;
        seen.add(n);
        images.push(n);
      }
      return { text: before, images };
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls) {
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      const images = Array.from(new Set([
        ...imagesFromBlock,
        ...candidates,
        ...looseImages,
      ]));

      containerEl.textContent = '';
      const textEl = document.createElement('div');
      textEl.className = 'answer-text';
      textEl.textContent = (text || '').trim().length ? text : '（已完成，但未返回答案）';
      containerEl.appendChild(textEl);

      if (images.length) {
        const wrap = document.createElement('div');
        wrap.className = 'answer-images';
        for (const url of images) {
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = url;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => { img.style.display = 'none'; });
          wrap.appendChild(img);
        }
        containerEl.appendChild(wrap);
      }
    }

    function showEmptyState() {
      chatEl.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'empty';
      box.id = 'emptyState';
      box.innerHTML = `
        <h2>有什么可以帮你？</h2>
        <p>我是灵犀智库客服助手。请尽量说明设备型号，我会依据说明书回答使用、维护与故障问题。</p>
        <div class="suggestions"></div>
      `;
      const grid = box.querySelector('.suggestions');
      for (const item of SUGGESTIONS) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'sug';
        b.innerHTML = `${escapeHtml(item.q)}<small>${escapeHtml(item.tip)}</small>`;
        b.addEventListener('click', () => {
          inputEl.value = item.q;
          onSend();
        });
        grid.appendChild(b);
      }
      chatEl.appendChild(box);
    }

    function clearChatMessages() {
      chatEl.innerHTML = '';
    }

    function addUserMsg(text, ts) {
      const empty = document.getElementById('emptyState');
      if (empty) empty.remove();
      const html = `
        <div class="msg user">
          <div class="avatar user">我</div>
          <div class="body">
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta-row"><span class="meta">${ts ? formatTime(ts) : nowTime()}</span></div>
          </div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls) {
      const empty = document.getElementById('emptyState');
      if (empty) empty.remove();
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      chatEl.insertAdjacentHTML('beforeend', `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">灵</div>
          <div class="body">
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta-row">
              <span class="meta">${formatTime(ts)}</span>
              <button type="button" class="icon-btn btn-copy">复制</button>
            </div>
          </div>
        </div>`);
      const el = document.getElementById(id);
      const answerEl = el.querySelector('.answer');
      renderAnswerWithImages(answerEl, text || '', imageUrls || []);
      el.querySelector('.btn-copy').addEventListener('click', () => copyAnswer(answerEl));
      scrollToBottom();
    }

    function addBotMsgSkeleton() {
      const empty = document.getElementById('emptyState');
      if (empty) empty.remove();
      const id = 'bot-' + Math.random().toString(36).slice(2);
      chatEl.insertAdjacentHTML('beforeend', `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">灵</div>
          <div class="body">
            <div class="bubble">
              <div class="typing"><span class="dots"><i></i><i></i><i></i></span><span>正在思考…</span></div>
              <div class="answer" hidden></div>
            </div>
            <div class="meta-row">
              <span class="meta">${nowTime()}</span>
              <button type="button" class="icon-btn btn-copy" hidden>复制</button>
            </div>
          </div>
        </div>`);
      scrollToBottom();
      return document.getElementById(id);
    }

    function copyAnswer(answerEl) {
      const t = answerEl.querySelector('.answer-text');
      const text = t ? t.textContent : answerEl.textContent;
      navigator.clipboard.writeText(text || '').then(() => {
        /* silent ok */
      }).catch(() => {});
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls) {
      const typing = botMsgEl.querySelector('.typing');
      if (typing) typing.remove();
      const answerEl = botMsgEl.querySelector('.answer');
      answerEl.hidden = false;
      const content = error ? `（错误：${error}）\n\n${answer || ''}` : (answer || '');
      renderAnswerWithImages(answerEl, content, imageUrls || []);
      const copyBtn = botMsgEl.querySelector('.btn-copy');
      if (copyBtn) {
        copyBtn.hidden = false;
        copyBtn.onclick = () => copyAnswer(answerEl);
      }
      scrollToBottom();
    }

    function setBusy(v) {
      busy = v;
      sendBtn.disabled = v;
      btnStop.disabled = !v;
    }

    function stopGeneration() {
      if (activeEs) {
        try { activeEs.close(); } catch (_) {}
        activeEs = null;
      }
      setBusy(false);
    }

    async function apiHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        if (!res.ok) throw new Error('bad');
        apiDot.classList.add('on');
        apiLabel.textContent = '服务已连接';
      } catch (_) {
        apiDot.classList.remove('on');
        apiLabel.textContent = '服务未连接';
      }
    }

    async function loadHistory() {
      clearChatMessages();
      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if (!res.ok) throw new Error('no history');
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if (!items.length) {
          showEmptyState();
          return;
        }
        for (const item of items) {
          if (item.role === 'user') addUserMsg(item.text || '', item.ts);
          else addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
        }
        scrollToBottom();
      } catch (_) {
        showEmptyState();
      }
    }

    async function submitQuery(text) {
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: streamToggle.checked,
        }),
      });
      if (!res.ok) throw new Error(await res.text() || '请求失败');
      return res.json();
    }

    async function onSend() {
      if (busy) return;
      const text = (inputEl.value || '').trim();
      if (!text) return;
      inputEl.value = '';
      inputEl.style.height = 'auto';
      addUserMsg(text);
      touchSession(text);
      const botMsgEl = addBotMsgSkeleton();
      setBusy(true);

      try {
        const isStream = streamToggle.checked;
        const data = await submitQuery(text);

        if (!isStream) {
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          setBusy(false);
          return;
        }

        const { session_id } = data;
        const answerEl = botMsgEl.querySelector('.answer');
        answerEl.hidden = false;
        let rawAnswerText = '';
        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        activeEs = es;

        const finish = () => {
          const typing = botMsgEl.querySelector('.typing');
          if (typing) typing.remove();
          const copyBtn = botMsgEl.querySelector('.btn-copy');
          if (copyBtn) {
            copyBtn.hidden = false;
            copyBtn.onclick = () => copyAnswer(answerEl);
          }
          es.close();
          if (activeEs === es) activeEs = null;
          setBusy(false);
        };

        // 进度事件：故意不渲染给客户，仅用于感知完成
        es.addEventListener('progress', (e) => {
          try {
            const d = JSON.parse(e.data || '{}');
            if (d && d.status === 'completed') {
              const typing = botMsgEl.querySelector('.typing');
              if (typing) typing.remove();
            }
          } catch (_) {}
        });

        es.addEventListener('delta', (e) => {
          try {
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if (!delta) return;
            const typing = botMsgEl.querySelector('.typing');
            if (typing) typing.remove();
            rawAnswerText += delta;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
            scrollToBottom();
          } catch (_) {}
        });

        const onFinal = (e) => {
          try {
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim())
              ? d.answer
              : (rawAnswerText || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          } catch (_) {}
          finish();
        };

        es.addEventListener('final', onFinal);
        es.addEventListener('final_answer', onFinal);

        es.addEventListener('error', (e) => {
          try {
            const msg = e && e.data ? (JSON.parse(e.data).error || '连接中断') : '连接中断';
            if (!rawAnswerText) rawAnswerText = `（错误：${msg}）`;
            else rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          } catch (_) {
            renderAnswerWithImages(answerEl, rawAnswerText || '（错误：连接中断）', []);
          }
          finish();
        });
      } catch (e) {
        finalizeBotAnswer(botMsgEl, '', e.message || String(e), []);
        setBusy(false);
      }
    }

    async function switchSession(id) {
      if (id === sessionId) return;
      stopGeneration();
      sessionId = id;
      store.currentId = id;
      saveStore();
      syncChrome();
      await loadHistory();
      inputEl.focus();
    }

    function newSession() {
      stopGeneration();
      const id = makeSessionId();
      store.sessions.unshift({ id, title: '新对话', updatedAt: Date.now() });
      store.currentId = id;
      sessionId = id;
      saveStore();
      syncChrome();
      showEmptyState();
      inputEl.focus();
    }

    sendBtn.addEventListener('click', onSend);
    btnStop.addEventListener('click', () => {
      stopGeneration();
      const last = chatEl.querySelector('.msg.bot:last-child .typing');
      if (last) {
        last.innerHTML = '<span>已停止生成</span>';
      }
    });
    btnNew.addEventListener('click', newSession);
    btnClear.addEventListener('click', async () => {
      if (!confirm('确定清空当前会话的历史记录吗？')) return;
      stopGeneration();
      try {
        await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
      } catch (_) {}
      showEmptyState();
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        onSend();
      }
    });
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
    });

    syncChrome();
    apiHealth();
    setInterval(apiHealth, 5000);
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
